name: weread2notion sync
description: Sync WeRead highlights and notes to Notion.
author: malinkang

inputs:
  weread-api-key:
    description: WeRead Gateway API key.
    required: true
  notion-token:
    description: Notion integration token.
    required: true
  notion-page:
    description: Notion database page URL or database ID.
    required: false
  notion-database-id:
    description: Notion database ID. Used when notion-page is not set.
    required: false
  notion-data-source-id:
    description: Notion data source ID. Preferred for Notion-Version 2026-03-11.
    required: false
  python-version:
    description: Python version used to run the sync.
    required: false
    default: "3.11"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install weread2notion
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "$GITHUB_ACTION_PATH"
    - name: Sync WeRead to Notion
      shell: bash
      env:
        WEREAD_API_KEY: ${{ inputs.weread-api-key }}
        NOTION_TOKEN: ${{ inputs.notion-token }}
        NOTION_PAGE: ${{ inputs.notion-page }}
        NOTION_DATABASE_ID: ${{ inputs.notion-database-id }}
        NOTION_DATA_SOURCE_ID: ${{ inputs.notion-data-source-id }}
      
      run: |
        LOG_FILE="$RUNNER_TEMP/weread-sync.log"
        if weread2notion sync > "$LOG_FILE" 2>&1; then
          echo "Sync completed."
        else
          if grep -Eq '缺少 WEREAD_API_KEY|WEREAD_API_KEY (为空|格式不正确)' "$LOG_FILE"; then
            echo "::error::WEREAD_API_KEY missing or invalid"
          elif grep -Eq '缺少 NOTION_TOKEN|NOTION_TOKEN (为空|格式不正确)' "$LOG_FILE"; then
            echo "::error::NOTION_TOKEN missing or invalid"
          elif grep -Eq 'NOTION_DATA_SOURCE_ID 格式不正确|NOTION_PAGE 格式不正确|缺少 NOTION_PAGE' "$LOG_FILE"; then
            echo "::error::Notion database configuration invalid"
          elif grep -q 'APIResponseError' "$LOG_FILE"; then
            echo "::error::Notion API failed; check token and database permissions"
          elif grep -Eq 'HTTPError|Gateway 请求失败' "$LOG_FILE"; then
            echo "::error::WeRead API request failed; check API key"
          else
            echo "::error::Unknown sync error; private details suppressed"
          fi
          exit 1
        fi

